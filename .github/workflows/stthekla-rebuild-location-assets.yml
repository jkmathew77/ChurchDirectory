name: Rebuild St. Thekla location images

on:
  push:
    branches:
      - feature/move-to-sacred-heart-chapel
    paths:
      - .github/workflows/stthekla-rebuild-location-assets.yml
      - assets/location/encoded/**

permissions:
  contents: write

concurrency:
  group: stthekla-rebuild-location-assets
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-to-sacred-heart-chapel
          fetch-depth: 0

      - name: Rebuild and verify WebP files
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f assets/location/encoded/complete.txt ]]; then
            echo 'Image staging is not complete yet.'
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat assets/location/encoded/chapel18.part*.b64 > "$RUNNER_TEMP/chapel.b64"
          cat assets/location/encoded/parking18.part*.b64 > "$RUNNER_TEMP/parking.b64"
          base64 --decode "$RUNNER_TEMP/chapel.b64" > assets/location/sacred-heart-chapel.webp
          base64 --decode "$RUNNER_TEMP/parking.b64" > assets/location/sacred-heart-parking-map.webp

          cat > "$RUNNER_TEMP/expected.sha256" <<'SUMS'
          ef4a331a5e5f242be168deea7416500fe23d692c8203dc9e5b16aa4b0320bf19  assets/location/sacred-heart-chapel.webp
          8431b375c01bf8be97e56ce63f74325a013db2a3c2983e6781bcc15bfb5495cd  assets/location/sacred-heart-parking-map.webp
          SUMS
          sha256sum --check "$RUNNER_TEMP/expected.sha256"

          file assets/location/sacred-heart-chapel.webp | tee "$RUNNER_TEMP/chapel-file.txt"
          file assets/location/sacred-heart-parking-map.webp | tee "$RUNNER_TEMP/parking-file.txt"
          grep -q 'Web/P image' "$RUNNER_TEMP/chapel-file.txt"
          grep -q '560x873' "$RUNNER_TEMP/chapel-file.txt"
          grep -q 'Web/P image' "$RUNNER_TEMP/parking-file.txt"
          grep -q '800x685' "$RUNNER_TEMP/parking-file.txt"

          rm -rf assets/location/encoded
          echo 'changed=yes' >> "$GITHUB_OUTPUT"

      - name: Commit verified image files
        if: steps.rebuild.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/location
          git commit -m 'Replace location assets with verified WebP images'
          git push origin HEAD:feature/move-to-sacred-heart-chapel
