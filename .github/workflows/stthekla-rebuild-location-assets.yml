name: Rebuild St. Thekla location images

on:
  push:
    branches:
      - feature/move-to-sacred-heart-chapel
    paths:
      - .github/workflows/stthekla-rebuild-location-assets.yml
      - assets/location/encoded/**

permissions:
  contents: write

concurrency:
  group: stthekla-rebuild-location-assets
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/move-to-sacred-heart-chapel
          fetch-depth: 0

      - name: Rebuild and verify WebP files
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f assets/location/encoded/chapel.part01.b64 ]]; then
            echo 'Location image chunks have already been consumed.'
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat assets/location/encoded/chapel.part*.b64 > "$RUNNER_TEMP/chapel.b64"
          cat assets/location/encoded/parking.part*.b64 > "$RUNNER_TEMP/parking.b64"
          base64 --decode "$RUNNER_TEMP/chapel.b64" > assets/location/sacred-heart-chapel.webp
          base64 --decode "$RUNNER_TEMP/parking.b64" > assets/location/sacred-heart-parking-map.webp

          echo '24b057bd676dd392023318f4a231fe937fe7de59949a910f2b0d6197254b1106  assets/location/sacred-heart-chapel.webp' > "$RUNNER_TEMP/expected.sha256"
          echo 'be7a3622ada853a715f5cf59c5f6c6f6ab0a8c0605953aa22cd32dfa535a0e9b  assets/location/sacred-heart-parking-map.webp' >> "$RUNNER_TEMP/expected.sha256"
          sha256sum --check "$RUNNER_TEMP/expected.sha256"

          file assets/location/sacred-heart-chapel.webp | tee "$RUNNER_TEMP/chapel-file.txt"
          file assets/location/sacred-heart-parking-map.webp | tee "$RUNNER_TEMP/parking-file.txt"
          grep -q 'Web/P image' "$RUNNER_TEMP/chapel-file.txt"
          grep -q '480x749' "$RUNNER_TEMP/chapel-file.txt"
          grep -q 'Web/P image' "$RUNNER_TEMP/parking-file.txt"
          grep -q '600x510' "$RUNNER_TEMP/parking-file.txt"

          rm -rf assets/location/encoded
          echo 'changed=yes' >> "$GITHUB_OUTPUT"

      - name: Commit verified image files
        if: steps.rebuild.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/location
          git commit -m 'Replace location assets with verified WebP images'
          git push origin HEAD:feature/move-to-sacred-heart-chapel
