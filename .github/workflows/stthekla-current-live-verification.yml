name: St. Thekla current live verification

on:
  push:
    branches:
      - ops/live-status-20260828
    paths:
      - .github/workflows/stthekla-current-live-verification.yml
      - ops/live-status-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify current production without changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: 162.241.24.113
      SSH_PORT: '22'
      SSH_USER: stthekla
      WP_PATH: /home3/stthekla/public_html
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STTHEKLA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa_stthekla"
          chmod 600 "$HOME/.ssh/id_rsa_stthekla"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa_stthekla" >/dev/null
          ssh-keyscan -T 20 -p "$SSH_PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect read-only WordPress state over SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-results
          ssh \
            -i "$HOME/.ssh/id_rsa_stthekla" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$WP_PATH" > verification-results/server-state.json <<'REMOTE'
          set -euo pipefail
          wp_path="$1"
          test -f "$wp_path/wp-config.php"
          wp --path="$wp_path" eval '
          include_once ABSPATH . "wp-admin/includes/plugin.php";
          $site_core_file = WP_PLUGIN_DIR . "/st-thekla-site-core/st-thekla-site-core.php";
          $directory_file = WP_PLUGIN_DIR . "/community-directory/community-directory.php";
          $site_core_data = file_exists($site_core_file) ? get_plugin_data($site_core_file, false, false) : array();
          $directory_data = file_exists($directory_file) ? get_plugin_data($directory_file, false, false) : array();
          $settings = get_option("stc_settings", array());
          $visit = get_option("stc_visit_settings", array());
          $schedule = get_option("stc_weekly_schedule", array());
          $visit_page = get_page_by_path("visit-us");
          $front_id = (int) get_option("page_on_front", 0);
          $report = array(
            "generated_at_utc" => gmdate("c"),
            "wordpress_version" => get_bloginfo("version"),
            "site_core" => array(
              "installed" => file_exists($site_core_file),
              "active" => is_plugin_active("st-thekla-site-core/st-thekla-site-core.php"),
              "version" => isset($site_core_data["Version"]) ? $site_core_data["Version"] : null,
              "data_version" => (string) get_option("stc_data_version", ""),
            ),
            "community_directory" => array(
              "installed" => file_exists($directory_file),
              "active" => is_plugin_active("community-directory/community-directory.php"),
              "version" => isset($directory_data["Version"]) ? $directory_data["Version"] : null,
              "db_version" => (string) get_option("cd_db_version", ""),
            ),
            "location" => array(
              "church_name" => isset($settings["church_name"]) ? $settings["church_name"] : "",
              "address_line_1" => isset($settings["address_line_1"]) ? $settings["address_line_1"] : "",
              "address_line_2" => isset($settings["address_line_2"]) ? $settings["address_line_2"] : "",
              "city" => isset($settings["city"]) ? $settings["city"] : "",
              "state" => isset($settings["state"]) ? $settings["state"] : "",
              "zip" => isset($settings["zip"]) ? $settings["zip"] : "",
              "map_url" => isset($settings["map_url"]) ? $settings["map_url"] : "",
            ),
            "visit" => array(
              "move_effective_date" => isset($visit["move_effective_date"]) ? $visit["move_effective_date"] : "",
              "move_announcement_enabled" => isset($visit["move_announcement_enabled"]) ? (string) $visit["move_announcement_enabled"] : "",
              "visit_image_id" => isset($visit["visit_image_id"]) ? (int) $visit["visit_image_id"] : 0,
              "parking_map_image_id" => isset($visit["parking_map_image_id"]) ? (int) $visit["parking_map_image_id"] : 0,
              "visit_page_url" => isset($visit["visit_page_url"]) ? $visit["visit_page_url"] : "",
            ),
            "schedule" => is_array($schedule) ? array_values($schedule) : array(),
            "pages" => array(
              "front_page_id" => $front_id,
              "front_page_status" => $front_id ? get_post_status($front_id) : null,
              "visit_page_exists" => $visit_page instanceof WP_Post,
              "visit_page_status" => $visit_page instanceof WP_Post ? $visit_page->post_status : null,
              "visit_page_id" => $visit_page instanceof WP_Post ? (int) $visit_page->ID : 0,
            ),
          );
          echo wp_json_encode($report, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          '
          REMOTE
          python3 -m json.tool verification-results/server-state.json >/dev/null

      - name: Verify current public pages and APIs externally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stthekla-live"
          common=(
            -sS
            -L
            --max-time 60
            -H 'Cache-Control: no-cache, no-store, must-revalidate'
            -H 'Pragma: no-cache'
            -H 'User-Agent: StThekla-Current-Live-Verification/1.0'
          )
          stamp="${GITHUB_RUN_ID}-$(date +%s%N)"

          fetch() {
            local name="$1"
            local url="$2"
            local separator='?'
            [[ "$url" == *\?* ]] && separator='&'
            curl "${common[@]}" -o "$RUNNER_TEMP/stthekla-live/$name.body" -w '%{http_code}' "${url}${separator}live_verify=${stamp}" > "$RUNNER_TEMP/stthekla-live/$name.status"
          }

          fetch home 'https://www.sttheklachurch.org/'
          fetch contact 'https://www.sttheklachurch.org/contact-us/'
          fetch visit 'https://www.sttheklachurch.org/visit-us/'
          fetch directory 'https://www.sttheklachurch.org/community/login/'
          fetch public_api 'https://www.sttheklachurch.org/wp-json/st-thekla/v1/public'
          fetch schedule_api 'https://www.sttheklachurch.org/wp-json/st-thekla/v1/weekly-schedule'

          python3 - "$RUNNER_TEMP/stthekla-live" > verification-results/public-state.json <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          def body(name):
              return (root / f'{name}.body').read_text(encoding='utf-8', errors='replace')
          def status(name):
              return int((root / f'{name}.status').read_text().strip() or 0)

          home = body('home')
          contact = body('contact')
          visit = body('visit')
          directory = body('directory')
          public_text = body('public_api')
          schedule_text = body('schedule_api')
          try:
              public = json.loads(public_text)
          except Exception:
              public = None
          try:
              schedule = json.loads(schedule_text)
          except Exception:
              schedule = None

          expected = [
              ('8:00 AM', 'Lilyo'),
              ('8:30 AM', 'Morning Prayer'),
              ('9:00 AM', 'Holy Qurbana'),
              ('10:10 AM', 'Dismissal'),
              ('10:30 AM', 'Refreshments / Fellowship'),
              ('10:45 AM', 'Tree of Life'),
              ('11:30 AM', 'End of Tree of Life'),
          ]
          actual = []
          if isinstance(schedule, dict):
              actual = [(str(i.get('time', '')), str(i.get('description', ''))) for i in schedule.get('items', []) if isinstance(i, dict)]

          old_terms = [
              '107 strawtown road', 'west nyack', '2 old ox road',
              'st. thomas lutheran church', 'st thomas lutheran church',
              'nyack, ny 10960', 'nyack, new york 10960'
          ]
          current_address = ['Sacred Heart Chapel', '175 Route 340', 'Sparkill', '10976']

          checks = {
              'home_http_200': status('home') == 200,
              'contact_http_200': status('contact') == 200,
              'visit_http_200': status('visit') == 200,
              'directory_http_200': status('directory') == 200,
              'public_api_http_200': status('public_api') == 200,
              'schedule_api_http_200': status('schedule_api') == 200,
              'home_new_location': all(v in home for v in current_address),
              'home_schedule_complete': all(t in home and d in home for t, d in expected),
              'home_exterior_image': 'stc-visit-image' in home,
              'home_no_old_location': not any(v in home.lower() for v in old_terms),
              'contact_new_location': all(v in contact for v in current_address),
              'contact_wpforms': 'wpforms-form-' in contact,
              'contact_no_old_location': not any(v in contact.lower() for v in old_terms),
              'visit_page_component': 'stc-visit-us-full' in visit,
              'visit_parking_map': 'stc-parking-map' in visit,
              'visit_new_location': all(v in visit for v in current_address),
              'visit_no_old_location': not any(v in visit.lower() for v in old_terms),
              'directory_login_component': 'cd-wrap cd-login' in directory and 'Member Login' in directory,
              'public_api_json': isinstance(public, dict),
              'public_api_move_date': isinstance(public, dict) and str(public.get('visit', {}).get('move_effective_date', '')) == '2026-08-23',
              'public_api_images': isinstance(public, dict) and bool(public.get('visit', {}).get('exterior_image_url')) and bool(public.get('visit', {}).get('parking_map_image_url')),
              'public_api_location': isinstance(public, dict) and 'Sacred Heart Chapel' in str(public.get('contact', {}).get('address', '')) and '175 Route 340' in str(public.get('contact', {}).get('address', '')),
              'schedule_exact': actual == expected,
          }
          failed = [name for name, passed in checks.items() if not passed]
          result = {
              'generated_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'checks': checks,
              'failed': failed,
              'all_public_checks_passed': not failed,
              'http_status': {name: status(name) for name in ['home','contact','visit','directory','public_api','schedule_api']},
              'schedule': actual,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          python3 -m json.tool verification-results/public-state.json >/dev/null

      - name: Build final live-status report
        shell: bash
        run: |
          set -euo pipefail
          python3 - verification-results/server-state.json verification-results/public-state.json > verification-results/live-status.json <<'PY'
          import json
          import sys
          from pathlib import Path

          server = json.loads(Path(sys.argv[1]).read_text())
          public = json.loads(Path(sys.argv[2]).read_text())
          expected = [
              {'time':'8:00 AM','description':'Lilyo'},
              {'time':'8:30 AM','description':'Morning Prayer'},
              {'time':'9:00 AM','description':'Holy Qurbana'},
              {'time':'10:10 AM','description':'Dismissal'},
              {'time':'10:30 AM','description':'Refreshments / Fellowship'},
              {'time':'10:45 AM','description':'Tree of Life'},
              {'time':'11:30 AM','description':'End of Tree of Life'},
          ]
          server_checks = {
              'site_core_active_0_3_0': server.get('site_core', {}).get('active') is True and server.get('site_core', {}).get('version') == '0.3.0',
              'data_version_003': server.get('site_core', {}).get('data_version') == '003',
              'community_directory_active_0_5_2': server.get('community_directory', {}).get('active') is True and server.get('community_directory', {}).get('version') == '0.5.2',
              'server_location_current': server.get('location', {}).get('address_line_1') == 'Sacred Heart Chapel' and server.get('location', {}).get('address_line_2') == '175 Route 340' and server.get('location', {}).get('city') == 'Sparkill' and server.get('location', {}).get('zip') == '10976',
              'server_move_date_current': server.get('visit', {}).get('move_effective_date') == '2026-08-23',
              'server_images_configured': int(server.get('visit', {}).get('visit_image_id') or 0) > 0 and int(server.get('visit', {}).get('parking_map_image_id') or 0) > 0,
              'server_visit_page_published': server.get('pages', {}).get('visit_page_exists') is True and server.get('pages', {}).get('visit_page_status') == 'publish',
              'server_schedule_exact': server.get('schedule') == expected,
          }
          server_failed = [k for k, v in server_checks.items() if not v]
          all_live = not server_failed and public.get('all_public_checks_passed') is True
          report = {
              'all_updates_live': all_live,
              'server_checks': server_checks,
              'server_failed': server_failed,
              'public_checks': public.get('checks', {}),
              'public_failed': public.get('failed', []),
              'server_state': server,
              'public_state': public,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          python3 -m json.tool verification-results/live-status.json >/dev/null
          cat verification-results/live-status.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stthekla-current-live-status-${{ github.run_id }}
          path: verification-results
          if-no-files-found: error
          retention-days: 7

      - name: Set workflow conclusion
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('verification-results/live-status.json').read_text())
          if not report.get('all_updates_live'):
              raise SystemExit('The Sparkill move release is not fully live.')
          PY
