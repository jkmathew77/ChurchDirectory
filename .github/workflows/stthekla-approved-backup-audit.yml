name: St. Thekla approved backup and audit

on:
  push:
    branches:
      - ops/stthekla-production-execution
    paths:
      - ops/wordpress-recovery/.execute-approved-backup-audit-20260821

permissions:
  contents: write

concurrency:
  group: stthekla-approved-backup-audit
  cancel-in-progress: false

jobs:
  backup-audit:
    name: Backup and read-only audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SSH_HOST: 162.241.24.113
      SSH_PORT: '22'
      SSH_USER: stthekla
      WP_PATH: /home3/stthekla/public_html
      RESULTS_DIR: ops/wordpress-recovery/results/latest
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: ops/stthekla-production-execution
          fetch-depth: 0

      - name: Configure SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STTHEKLA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${SSH_PRIVATE_KEY:-}" || { echo 'Missing STTHEKLA_SSH_PRIVATE_KEY'; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa_stthekla"
          chmod 600 "$HOME/.ssh/id_rsa_stthekla"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa_stthekla" >/dev/null
          ssh-keyscan -T 20 -p "$SSH_PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH and WordPress access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          ssh \
            -i "$HOME/.ssh/id_rsa_stthekla" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; printf 'ssh=ok\\n'; printf 'user=%s\\n' \"\$(id -un)\"; printf 'host=%s\\n' \"\$(hostname)\"; test -f '$WP_PATH/wp-config.php'; command -v wp >/dev/null; printf 'wp_cli=%s\\n' \"\$(command -v wp)\"; printf 'wordpress=%s\\n' \"\$(wp --path='$WP_PATH' core version)\"; printf 'php=%s\\n' \"\$(php -r 'echo PHP_VERSION;')\"" \
            | tee "$RESULTS_DIR/connectivity.txt"

      - name: Package recovery toolkit
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/stthekla-recovery-toolkit.tar.gz" ops/wordpress-recovery \
            --exclude='ops/wordpress-recovery/results'

      - name: Run private backup and read-only audit on Bluehost
        shell: bash
        run: |
          set -euo pipefail
          run_token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_root="stthekla-recovery-runs/$run_token"
          ssh_opts=(
            -i "$HOME/.ssh/id_rsa_stthekla"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp_opts=(
            -i "$HOME/.ssh/id_rsa_stthekla"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$remote_root'"
          scp "${scp_opts[@]}" \
            "$RUNNER_TEMP/stthekla-recovery-toolkit.tar.gz" \
            "$SSH_USER@$SSH_HOST:$remote_root/toolkit.tar.gz"

          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$run_token" "$WP_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077

          run_token="$1"
          wp_path="$2"
          remote_root="$HOME/stthekla-recovery-runs/$run_token"
          toolkit_dir="$remote_root/toolkit"
          backup_log="$remote_root/backup.log"
          audit_log="$remote_root/audit.log"
          audit_dir="$HOME/stthekla-audits/github-$run_token"
          safe_dir="$remote_root/safe-results"

          mkdir -p "$toolkit_dir" "$safe_dir"
          tar -xzf "$remote_root/toolkit.tar.gz" -C "$toolkit_dir"
          chmod 700 "$toolkit_dir/ops/wordpress-recovery/backup-before-recovery.sh"
          chmod 700 "$toolkit_dir/ops/wordpress-recovery/site-audit.sh"

          bash "$toolkit_dir/ops/wordpress-recovery/backup-before-recovery.sh" "$wp_path" | tee "$backup_log"
          backup_dir="$(sed -n 's/^Location: //p' "$backup_log" | tail -n 1)"
          test -n "$backup_dir"
          test -d "$backup_dir"
          test -s "$backup_dir/database.sql"
          test -s "$backup_dir/site-files.tar.gz"
          test -s "$backup_dir/SHA256SUMS"
          ( cd "$backup_dir" && sha256sum -c SHA256SUMS )

          bash "$toolkit_dir/ops/wordpress-recovery/site-audit.sh" "$wp_path" "$audit_dir" | tee "$audit_log"

          safe_files=(
            core-version.txt
            core-checksums.txt
            plugins.csv
            themes.csv
            user-count.txt
            roles.csv
            cron-events.csv
            public-registration.txt
            default-comment-status.txt
            permalink-structure.txt
            database-table-sizes.csv
            shortcode-usage.csv
            community-directory-health.json
            community-directory-filesystem.txt
            plugin-directory-sizes.csv
          )

          for filename in "${safe_files[@]}"; do
            if [[ -f "$audit_dir/$filename" ]]; then
              cp "$audit_dir/$filename" "$safe_dir/$filename"
            fi
          done

          cp "$backup_dir/SHA256SUMS" "$safe_dir/backup-SHA256SUMS.txt"
          du -h "$backup_dir/database.sql" "$backup_dir/site-files.tar.gz" > "$safe_dir/backup-file-sizes.txt"
          {
            printf 'run_token=%s\n' "$run_token"
            printf 'backup_directory=%s\n' "$backup_dir"
            printf 'audit_directory=%s\n' "$audit_dir"
            printf 'wordpress_path=%s\n' "$wp_path"
            printf 'completed_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'user_reconciliation_retained_privately=%s\n' "$audit_dir/users-directory-reconciliation.csv"
          } > "$safe_dir/execution-summary.txt"

          tar -czf "$remote_root/safe-results.tar.gz" -C "$safe_dir" .
          chmod -R go-rwx "$remote_root" "$backup_dir" "$audit_dir"
          rm -f "$remote_root/toolkit.tar.gz"
          REMOTE_SCRIPT

          scp "${scp_opts[@]}" \
            "$SSH_USER@$SSH_HOST:$remote_root/safe-results.tar.gz" \
            "$RUNNER_TEMP/stthekla-safe-results.tar.gz"

          rm -rf "$RESULTS_DIR"
          mkdir -p "$RESULTS_DIR"
          tar -xzf "$RUNNER_TEMP/stthekla-safe-results.tar.gz" -C "$RESULTS_DIR"

      - name: Publish safe diagnostic results to execution branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RESULTS_DIR"
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m "Record approved St. Thekla production backup and audit"
            git push origin HEAD:ops/stthekla-production-execution
          fi

      - name: Upload safe diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stthekla-approved-backup-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/wordpress-recovery/results/latest
          if-no-files-found: warn
          retention-days: 14
