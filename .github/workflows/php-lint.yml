name: PHP lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.2'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find plugin -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

  package-directory:
    name: Package Community Directory
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: python3 plugin/pack_plugin.py

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: community-directory-0.5.2
          path: plugin/community-directory-0.5.2.zip
          if-no-files-found: error
          retention-days: 14

  package-site-core:
    name: Package St. Thekla Site Core
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          cd plugin
          zip -qr st-thekla-site-core-0.3.0.zip st-thekla-site-core

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: st-thekla-site-core-0.3.0
          path: plugin/st-thekla-site-core-0.3.0.zip
          if-no-files-found: error
          retention-days: 14
