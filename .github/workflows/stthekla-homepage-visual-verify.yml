name: St. Thekla homepage visual verification

on:
  push:
    branches:
      - ops/stthekla-production-execution
    paths:
      - .github/workflows/stthekla-homepage-visual-verify.yml
      - ops/wordpress-recovery/.homepage-visual-trigger

permissions:
  contents: read

jobs:
  verify:
    name: Verify homepage image alignment in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out operational branch
        uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture and verify desktop and mobile layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-results
          cat > "$RUNNER_TEMP/verify-homepage.cjs" <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const baseUrl = 'https://www.sttheklachurch.org/';
          const cacheBust = `${Date.now()}-${process.env.GITHUB_RUN_ID || 'local'}`;
          const results = {};

          async function inspect(browser, name, viewport) {
            const page = await browser.newPage({ viewportSize: viewport, deviceScaleFactor: 1 });
            await page.goto(`${baseUrl}?homepage_visual=${cacheBust}-${name}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForSelector('.stc-visit-us-compact .stc-visit-image-wrap', { timeout: 30000 });
            await page.waitForSelector('.stc-visit-us-compact .stc-visit-image', { timeout: 30000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});

            const report = await page.evaluate(() => {
              const compact = document.querySelector('.stc-visit-us-compact');
              const primary = document.querySelector('.stc-visit-us-compact .stc-visit-primary');
              const imageWrap = document.querySelector('.stc-visit-us-compact .stc-visit-image-wrap');
              const image = document.querySelector('.stc-visit-us-compact .stc-visit-image');
              const telEmpty = document.querySelector('a[href="tel:"], a[href="tel:+"]');
              const stylesheet = [...document.querySelectorAll('link[rel="stylesheet"]')]
                .map((link) => link.href)
                .find((href) => href.includes('/st-thekla-site-core/assets/css/public.css')) || '';

              if (!compact || !primary || !imageWrap || !image) {
                throw new Error('Required compact Visit Us elements were not found.');
              }

              const compactBox = compact.getBoundingClientRect();
              const primaryBox = primary.getBoundingClientRect();
              const wrapBox = imageWrap.getBoundingClientRect();
              const imageBox = image.getBoundingClientRect();
              const primaryStyle = getComputedStyle(primary);
              const wrapStyle = getComputedStyle(imageWrap);

              const compactCenter = compactBox.left + compactBox.width / 2;
              const wrapCenter = wrapBox.left + wrapBox.width / 2;
              const imageCenter = imageBox.left + imageBox.width / 2;

              return {
                url: location.href,
                title: document.title,
                stylesheet,
                siteCore031Stylesheet: /[?&]ver=0\.3\.1(?:&|$)/.test(stylesheet),
                emptyTelephoneLinkPresent: Boolean(telEmpty),
                compactBox: {
                  left: compactBox.left,
                  width: compactBox.width,
                  center: compactCenter,
                },
                primaryBox: {
                  left: primaryBox.left,
                  width: primaryBox.width,
                },
                imageWrapBox: {
                  left: wrapBox.left,
                  width: wrapBox.width,
                  center: wrapCenter,
                },
                imageBox: {
                  left: imageBox.left,
                  width: imageBox.width,
                  center: imageCenter,
                },
                imageWrapCenterDeltaFromCompact: Math.abs(wrapCenter - compactCenter),
                imageCenterDeltaFromCompact: Math.abs(imageCenter - compactCenter),
                primaryGridTemplateColumns: primaryStyle.gridTemplateColumns,
                imageWrapJustifySelf: wrapStyle.justifySelf,
                imageWrapMarginLeft: wrapStyle.marginLeft,
                imageWrapMarginRight: wrapStyle.marginRight,
              };
            });

            report.checks = {
              siteCore031Stylesheet: report.siteCore031Stylesheet,
              noEmptyTelephoneLink: !report.emptyTelephoneLinkPresent,
              compactUsesSingleColumn: !report.primaryGridTemplateColumns.includes(' ') || viewport.width <= 760,
              imageWrapCenteredWithinCompact: report.imageWrapCenterDeltaFromCompact <= 3,
              imageCenteredWithinCompact: report.imageCenterDeltaFromCompact <= 3,
            };
            report.allChecksPassed = Object.values(report.checks).every(Boolean);

            await page.screenshot({
              path: `visual-results/homepage-${name}-full.png`,
              fullPage: true,
            });
            await page.locator('.stc-visit-us-compact').screenshot({
              path: `visual-results/homepage-${name}-component.png`,
            });

            await page.close();
            return report;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              results.desktop = await inspect(browser, 'desktop', { width: 1280, height: 1500 });
              results.mobile = await inspect(browser, 'mobile', { width: 390, height: 844 });
            } finally {
              await browser.close();
            }

            results.allChecksPassed = results.desktop.allChecksPassed && results.mobile.allChecksPassed;
            fs.writeFileSync('visual-results/report.json', JSON.stringify(results, null, 2) + '\n');
            console.log(JSON.stringify(results, null, 2));
            if (!results.allChecksPassed) {
              process.exit(1);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node "$RUNNER_TEMP/verify-homepage.cjs"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stthekla-homepage-visual-${{ github.run_id }}
          path: visual-results
          if-no-files-found: error
          retention-days: 14
