name: Recovery toolkit checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate all recovery shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find ops/wordpress-recovery -type f -name '*.sh' -print0 \
            | sort -z \
            | xargs -0 -n1 bash -n

      - name: Validate all recovery PHP scripts
        shell: bash
        run: |
          set -euo pipefail
          find ops/wordpress-recovery -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l
