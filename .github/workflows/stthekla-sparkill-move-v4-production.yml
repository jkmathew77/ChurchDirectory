name: Deploy St. Thekla Sparkill move v4

on:
  push:
    branches:
      - ops/stthekla-production-execution
    paths:
      - .github/workflows/stthekla-sparkill-move-v4-production.yml
      - ops/wordpress-recovery/.sparkill-move-trigger
      - ops/wordpress-recovery/deploy-sparkill-move-v4.sh
      - ops/wordpress-recovery/deploy-sparkill-move.sh
      - ops/wordpress-recovery/apply-sparkill-move.php
      - ops/wordpress-recovery/purge-bluehost-cache.php
      - ops/wordpress-recovery/move-images-v4.part*.b64

permissions:
  contents: read

concurrency:
  group: stthekla-sparkill-move-v4-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup-gated Sparkill move release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SSH_HOST: 162.241.24.113
      SSH_PORT: '22'
      SSH_USER: stthekla
      WP_PATH: /home3/stthekla/public_html
      TRIGGER_FILE: ops/wordpress-recovery/.sparkill-move-trigger
      IMAGE_B64_LENGTH: '78108'
      IMAGE_ARCHIVE_SHA256: 812bfc8273c3fe7b7406edd5025f57bfeacade1762afa7d6f8ccdc368624ce87
    steps:
      - name: Check out operational release branch
        uses: actions/checkout@v4
        with:
          ref: ops/stthekla-production-execution

      - name: Validate release trigger
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '[:space:]' < "$TRIGGER_FILE")"
          case "$mode" in
            idle|deploy) ;;
            *) echo "Unsupported Sparkill move trigger: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          mkdir -p release-results
          printf 'mode=%s\n' "$mode" > release-results/trigger.txt

      - name: Validate scripts and optimized image payload
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/wordpress-recovery/deploy-sparkill-move.sh
          bash -n ops/wordpress-recovery/deploy-sparkill-move-v4.sh
          php -l ops/wordpress-recovery/apply-sparkill-move.php

          parts=(ops/wordpress-recovery/move-images-v4.part*.b64)
          test "${#parts[@]}" -eq 14
          cat "${parts[@]}" > "$RUNNER_TEMP/move-images-v4.b64"
          actual_length="$(wc -c < "$RUNNER_TEMP/move-images-v4.b64" | tr -d '[:space:]')"
          test "$actual_length" = "$IMAGE_B64_LENGTH"
          base64 --decode "$RUNNER_TEMP/move-images-v4.b64" > "$RUNNER_TEMP/move-images-v4.tar.gz"
          echo "$IMAGE_ARCHIVE_SHA256  $RUNNER_TEMP/move-images-v4.tar.gz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/move-images-v4.tar.gz" | sort | tee release-results/image-archive-files.txt
          grep -qx 'st-thekla-sacred-heart-chapel-new-home.webp' release-results/image-archive-files.txt
          grep -qx 'st-thekla-sacred-heart-chapel-parking-map.webp' release-results/image-archive-files.txt

      - name: Configure SSH
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STTHEKLA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${SSH_PRIVATE_KEY:-}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_rsa_stthekla"
          chmod 600 "$HOME/.ssh/id_rsa_stthekla"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa_stthekla" >/dev/null
          ssh-keyscan -T 20 -p "$SSH_PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" > release-results/host-key-fingerprints.txt

      - name: Verify Bluehost and WordPress access
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/id_rsa_stthekla" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; test -f '$WP_PATH/wp-config.php'; command -v wp >/dev/null; command -v git >/dev/null; command -v php >/dev/null; command -v curl >/dev/null; command -v python3 >/dev/null; printf 'ssh=ok\\nwordpress=%s\\nphp=%s\\n' \"\$(wp --path='$WP_PATH' core version)\" \"\$(php -r 'echo PHP_VERSION;')\"" \
            | tee release-results/connectivity.txt

      - name: Execute exact production release
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          run_token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_root_rel="stthekla-sparkill-move-v4-runs/$run_token"
          toolkit="$RUNNER_TEMP/stthekla-sparkill-move-v4.tar.gz"
          ssh_base=(
            -i "$HOME/.ssh/id_rsa_stthekla"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          scp_base=(
            -i "$HOME/.ssh/id_rsa_stthekla"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          tar -czf "$toolkit" \
            ops/wordpress-recovery/deploy-sparkill-move-v4.sh \
            ops/wordpress-recovery/deploy-sparkill-move.sh \
            ops/wordpress-recovery/apply-sparkill-move.php \
            ops/wordpress-recovery/purge-bluehost-cache.php \
            ops/wordpress-recovery/move-images-v4.part*.b64

          ssh "${ssh_base[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$remote_root_rel'"
          scp "${scp_base[@]}" "$toolkit" "$SSH_USER@$SSH_HOST:$remote_root_rel/toolkit.tar.gz"

          ssh "${ssh_base[@]}" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$run_token" "$WP_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          umask 077
          run_token="$1"
          wp_path="$2"
          remote_root="$HOME/stthekla-sparkill-move-v4-runs/$run_token"
          toolkit_dir="$remote_root/toolkit"
          output_dir="$HOME/stthekla-change-logs/$run_token-sparkill-move-v4"
          safe_dir="$remote_root/safe-results"

          mkdir -p "$toolkit_dir" "$safe_dir"
          tar -xzf "$remote_root/toolkit.tar.gz" -C "$toolkit_dir"
          script_dir="$toolkit_dir/ops/wordpress-recovery"
          chmod 700 "$script_dir/deploy-sparkill-move-v4.sh" "$script_dir/deploy-sparkill-move.sh"
          bash "$script_dir/deploy-sparkill-move-v4.sh" "$wp_path" "$output_dir"

          find "$output_dir" -maxdepth 1 -type f ! -name '*.body' -print0 \
            | while IFS= read -r -d '' file; do cp "$file" "$safe_dir/"; done
          tar -czf "$remote_root/safe-results.tar.gz" -C "$safe_dir" .
          chmod -R go-rwx "$remote_root" "$output_dir"
          rm -f "$remote_root/toolkit.tar.gz"
          REMOTE_SCRIPT

          scp "${scp_base[@]}" \
            "$SSH_USER@$SSH_HOST:$remote_root_rel/safe-results.tar.gz" \
            "$RUNNER_TEMP/stthekla-sparkill-move-v4-results.tar.gz"
          mkdir -p release-results/production-results
          tar -xzf "$RUNNER_TEMP/stthekla-sparkill-move-v4-results.tar.gz" \
            -C release-results/production-results

      - name: Independently verify public URLs
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/external-smoke"
          common=(
            -sS
            -L
            --max-time 60
            -H 'Cache-Control: no-cache, no-store, must-revalidate'
            -H 'Pragma: no-cache'
            -H 'User-Agent: StThekla-Sparkill-External-Smoke/2.0'
          )
          stamp="${GITHUB_RUN_ID}-$(date +%s%N)"

          fetch() {
            local name="$1"
            local url="$2"
            local separator='?'
            [[ "$url" == *\?* ]] && separator='&'
            curl "${common[@]}" -o "$RUNNER_TEMP/external-smoke/$name.body" -w '%{http_code}' "${url}${separator}sparkill_external=$stamp" > "$RUNNER_TEMP/external-smoke/$name.status"
          }

          fetch home 'https://www.sttheklachurch.org/'
          fetch contact 'https://www.sttheklachurch.org/contact-us/'
          fetch visit 'https://www.sttheklachurch.org/visit-us/'
          fetch directory 'https://www.sttheklachurch.org/community/login/'
          fetch public_api 'https://www.sttheklachurch.org/wp-json/st-thekla/v1/public'
          fetch schedule_api 'https://www.sttheklachurch.org/wp-json/st-thekla/v1/weekly-schedule'

          python3 - "$RUNNER_TEMP/external-smoke" > release-results/external-public-verification.json <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          def body(name):
              return (root / f'{name}.body').read_text(encoding='utf-8', errors='replace')
          def status(name):
              return int((root / f'{name}.status').read_text().strip() or 0)

          home = body('home')
          contact = body('contact')
          visit = body('visit')
          directory = body('directory')
          public = json.loads(body('public_api'))
          schedule = json.loads(body('schedule_api'))
          old = [
              '107 strawtown road', 'west nyack', '2 old ox road',
              'st. thomas lutheran church', 'st thomas lutheran church',
              'nyack, ny 10960', 'nyack, new york 10960'
          ]
          expected = [
              ('8:00 AM', 'Lilyo'),
              ('8:30 AM', 'Morning Prayer'),
              ('9:00 AM', 'Holy Qurbana'),
              ('10:10 AM', 'Dismissal'),
              ('10:30 AM', 'Refreshments / Fellowship'),
              ('10:45 AM', 'Tree of Life'),
              ('11:30 AM', 'End of Tree of Life'),
          ]
          actual = [
              (str(item.get('time', '')), str(item.get('description', '')))
              for item in schedule.get('items', []) if isinstance(item, dict)
          ]
          checks = {
              'home_http_200': status('home') == 200,
              'contact_http_200': status('contact') == 200,
              'visit_http_200': status('visit') == 200,
              'directory_http_200': status('directory') == 200,
              'public_api_http_200': status('public_api') == 200,
              'schedule_api_http_200': status('schedule_api') == 200,
              'home_component': 'stc-visit-us-compact' in home and 'stc-visit-image' in home,
              'home_location': 'Sacred Heart Chapel' in home and '175 Route 340' in home and 'Sparkill' in home,
              'home_schedule': all(time in home and label in home for time, label in expected),
              'home_no_old': not any(value in home.lower() for value in old),
              'contact_form': 'wpforms-form-' in contact,
              'contact_location': 'Sacred Heart Chapel' in contact and '175 Route 340' in contact,
              'contact_no_old': not any(value in contact.lower() for value in old),
              'visit_component': 'stc-visit-us-full' in visit and 'stc-parking-map' in visit,
              'visit_no_old': not any(value in visit.lower() for value in old),
              'directory_login': 'cd-wrap cd-login' in directory and 'Member Login' in directory,
              'api_location': 'Sacred Heart Chapel' in str(public.get('contact', {}).get('address', '')) and '175 Route 340' in str(public.get('contact', {}).get('address', '')),
              'api_move_date': str(public.get('visit', {}).get('move_effective_date', '')) == '2026-08-23',
              'api_images': bool(public.get('visit', {}).get('exterior_image_url')) and bool(public.get('visit', {}).get('parking_map_image_url')),
              'schedule_exact': actual == expected,
          }
          failed = [name for name, passed in checks.items() if not passed]
          report = {
              'checks': checks,
              'failed': failed,
              'all_checks_passed': not failed,
              'http_status': {name: status(name) for name in ['home','contact','visit','directory','public_api','schedule_api']},
              'schedule': actual,
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if failed:
              raise SystemExit('External Sparkill move verification failed: ' + ', '.join(failed))
          PY

      - name: Record idle result
        if: steps.mode.outputs.mode == 'idle'
        shell: bash
        run: echo 'Sparkill move deployment is idle.'

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stthekla-sparkill-move-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-results
          if-no-files-found: error
          retention-days: 14
