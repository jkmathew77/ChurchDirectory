name: Apply Site Core 0.3.0 move source

on:
  push:
    branches:
      - ops/stthekla-production-execution
    paths:
      - .github/workflows/apply-site-core-move-source.yml
      - ops/wordpress-recovery/site-core-0.3.0-payload.part*

permissions:
  contents: write

concurrency:
  group: stthekla-site-core-move-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational payload
        uses: actions/checkout@v4
        with:
          ref: ops/stthekla-production-execution
          path: ops-source
          fetch-depth: 1

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/site-core-sparkill-location-0.3.0
          path: work
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify and apply source payload
        shell: bash
        run: |
          set -euo pipefail
          payload_b64="$RUNNER_TEMP/site-core-0.3.0-payload.b64"
          payload="$RUNNER_TEMP/site-core-0.3.0-payload.tar.gz"
          cat "$GITHUB_WORKSPACE"/ops-source/ops/wordpress-recovery/site-core-0.3.0-payload.part* > "$payload_b64"
          test "$(wc -c < "$payload_b64")" -eq 14844
          base64 --decode "$payload_b64" > "$payload"
          echo 'f9fa05efeb9d82cf2f455db5739b52e597ef93addf4e58cf7df136252c8ee250  '"$payload" | sha256sum -c -
          tar -xzf "$payload" -C "$GITHUB_WORKSPACE/work"

          cd "$GITHUB_WORKSPACE/work"
          find plugin/st-thekla-site-core -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          grep -q 'Version:     0.3.0' plugin/st-thekla-site-core/st-thekla-site-core.php
          grep -q "define( 'STC_DATA_VERSION', '003' )" plugin/st-thekla-site-core/st-thekla-site-core.php

      - name: Commit feature source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/work"
          git config user.name 'St. Thekla Release Automation'
          git config user.email '51372339+jkmathew77@users.noreply.github.com'
          git add \
            .github/workflows/php-lint.yml \
            Docs/LOCATION-MOVE-2026.md \
            plugin/st-thekla-site-core
          if git diff --cached --quiet; then
            echo 'Feature branch already contains this source.'
            git rev-parse HEAD | tee "$RUNNER_TEMP/feature-commit.txt"
            exit 0
          fi
          git commit -m 'Add Sacred Heart Chapel move support in Site Core 0.3.0'
          git push origin HEAD:feature/site-core-sparkill-location-0.3.0
          git rev-parse HEAD | tee "$RUNNER_TEMP/feature-commit.txt"

      - name: Upload commit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-core-move-source-${{ github.run_id }}
          path: ${{ runner.temp }}/feature-commit.txt
          if-no-files-found: warn
          retention-days: 7

# One-time release source application; this operational workflow is not merged to main.
